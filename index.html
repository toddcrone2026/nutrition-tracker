<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1814">
<title>Nutrition Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f7f6f3;--surface:#fff;--surface2:#f0ece5;--border:#e4e0d8;--text1:#1a1814;--text2:#6b6760;--text3:#9b9590;--primary:#2d9e6b;--primary-dim:rgba(45,158,107,0.12);--warn:#e8862b;--warn-dim:rgba(232,134,43,0.12);--danger:#e53935;--teal:#2db5a3;--radius:16px;--radius-sm:10px;--font:'Figtree',system-ui,sans-serif;--nav-h:calc(56px + env(safe-area-inset-bottom,0px));color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131210;--surface:#1e1c19;--surface2:#252320;--border:#2e2b26;--text1:#f0ede8;--text2:#8a8680;--text3:#5a5850;--primary:#34c47e;--primary-dim:rgba(52,196,126,0.12);--warn:#f0973a;--warn-dim:rgba(240,151,58,0.12);color-scheme:dark}}
:root[data-theme="light"]{--bg:#f7f6f3;--surface:#fff;--surface2:#f0ece5;--border:#e4e0d8;--text1:#1a1814;--text2:#6b6760;--text3:#9b9590;--primary:#2d9e6b;--primary-dim:rgba(45,158,107,0.12);--warn:#e8862b;--warn-dim:rgba(232,134,43,0.12);color-scheme:light}
:root[data-theme="dark"]{--bg:#131210;--surface:#1e1c19;--surface2:#252320;--border:#2e2b26;--text1:#f0ede8;--text2:#8a8680;--text3:#5a5850;--primary:#34c47e;--primary-dim:rgba(52,196,126,0.12);--warn:#f0973a;--warn-dim:rgba(240,151,58,0.12);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text1);font-size:15px;line-height:1.4;overscroll-behavior:none;overflow:hidden;height:100%}
#app{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:11}
#app-header{background:var(--surface);border-bottom:1px solid var(--border);padding:max(12px,env(safe-area-inset-top,12px)) 16px 0;flex-shrink:0;position:sticky;top:0;z-index:10}
.header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.app-title{font-size:20px;font-weight:800}
.app-title span{color:var(--primary)}
.header-date{font-size:12px;color:var(--text2);margin-top:1px}
.header-actions{display:flex;gap:8px}
.icon-btn{background:var(--surface2);border:none;border-radius:50%;width:36px;height:36px;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text1)}
.icon-btn:active{opacity:.7}
.macro-strip{padding:8px 0 10px}
.macro-strip-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.macro-strip-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text2)}
.cal-tile{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:10px;padding:8px 10px}
.cal-ring{position:relative;width:36px;height:36px;flex-shrink:0}
.cal-ring svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--border);stroke-width:3}
.ring-fill{fill:none;stroke:var(--primary);stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset .4s}
.ring-fill.warn{stroke:var(--warn)}
.ring-fill.over{stroke:var(--danger)}
.ring-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;color:var(--text1)}
.cal-info{min-width:0}
.cal-num{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.cal-of{font-size:10px;color:var(--text2)}
.cal-rem{font-size:10px;color:var(--text3);font-variant-numeric:tabular-nums}
.macro-tiles{display:block}
.macro-summary-row{display:flex;justify-content:center;padding:10px 0 6px}
.pie-ring-wrap{position:relative;flex-shrink:0;display:flex;align-items:center;justify-content:center;width:120px;height:120px}
.pie-ring-wrap svg{position:absolute;inset:0}
.pie-ring-center{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.pie-cal-num{font-size:22px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.pie-cal-label{font-size:10px;color:var(--text2);font-variant-numeric:tabular-nums}
.pie-cal-unit{font-size:9px;color:var(--text3)}
.macro-rings-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.macro-ring-tile{background:var(--surface2);border-radius:12px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:3px}
.macro-ring-tile.over .tile-val{color:var(--danger)}
.macro-ring-tile.warn .tile-val{color:var(--warn)}
.tile-name{font-size:10px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.tile-val{font-size:14px;font-weight:800;color:var(--text1);line-height:1.2;font-variant-numeric:tabular-nums}
.tile-unit{font-size:10px;font-weight:400;color:var(--text3)}
.mring{position:relative;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mring svg{transform:rotate(-90deg)}
.mring-pct{position:absolute;font-size:8px;font-weight:800;color:var(--text2)}
.mring-bg{fill:none;stroke:var(--border);stroke-width:3}
.mring-fill{fill:none;stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.mring-fill.carbs{stroke:#f5a623}
.mring-fill.protein{stroke:#27ae60}
.mring-fill.fat{stroke:#e53935}
.mring-fill.over{stroke:var(--danger)}
.mring-fill.warn{stroke:var(--warn)}
.tile-name{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text2)}
.tile-val{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.tile-rem{font-size:9px;color:var(--text3);font-variant-numeric:tabular-nums}
#bottom-nav{display:flex;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px);flex-shrink:0}
.nav-btn{flex:1;background:none;border:none;padding:10px 4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text2);font-family:var(--font);transition:color .15s}
.nav-btn.active{color:var(--primary)}
.nav-icon{font-size:20px;line-height:1}
.nav-label{font-size:10px;font-weight:700;letter-spacing:.3px}
#tab-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.section-title{font-size:18px;font-weight:800;margin-bottom:14px}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:var(--radius-sm);font-family:var(--font);font-size:15px;font-weight:700;cursor:pointer;text-align:center;transition:opacity .15s}
.btn:active{opacity:.8}
.btn-primary{background:var(--primary);color:#fff}
.btn-secondary{background:var(--surface2);color:var(--text1);border:1px solid var(--border)}
.form-group{margin-bottom:14px}
.form-label{font-size:12px;font-weight:700;color:var(--text2);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.form-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 12px;font-family:var(--font);font-size:15px;color:var(--text1);outline:none;transition:border-color .15s}
.form-input:focus{border-color:var(--primary)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#wizard-overlay{position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto;display:flex;flex-direction:column;padding:max(24px,env(safe-area-inset-top,24px)) 20px max(32px,env(safe-area-inset-bottom,32px))}
#wizard-overlay.hidden{display:none}
.wiz-logo{font-size:36px;margin-bottom:8px}
.wiz-title{font-size:26px;font-weight:800;line-height:1.15}
.wiz-sub{font-size:14px;color:var(--text2);margin-top:6px;margin-bottom:28px}
.wiz-prog{display:flex;gap:5px;margin-bottom:28px}
.wiz-dot{height:4px;flex:1;border-radius:99px;background:var(--border);transition:background .3s}
.wiz-dot.done{background:var(--primary)}
.wiz-q{font-size:20px;font-weight:800;margin-bottom:6px}
.wiz-hint{font-size:13px;color:var(--text2);margin-bottom:20px}
.wiz-opts{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.wiz-opt{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;cursor:pointer;transition:border-color .15s,background .15s;text-align:left;font-family:var(--font)}
.wiz-opt.selected{border-color:var(--primary);background:var(--primary-dim)}
.wiz-opt-title{font-size:15px;font-weight:700;color:var(--text1)}
.wiz-opt-desc{font-size:12px;color:var(--text2);margin-top:2px}
.wiz-nav{display:flex;gap:10px;margin-top:auto;padding-top:20px}
.meal-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
.meal-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border)}
.meal-hd-left{display:flex;align-items:center;gap:8px}
.meal-icon{font-size:18px;line-height:1}
.meal-name{font-size:14px;font-weight:700}
.meal-kcal{font-size:12px;color:var(--text2);font-variant-numeric:tabular-nums}
.add-btn{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border:none;border-radius:20px;font-family:var(--font);font-size:12px;font-weight:700;cursor:pointer;background:var(--primary-dim);color:var(--primary)}
.log-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border)}
.log-item:last-child{border-bottom:none}
.log-item-left{min-width:0;flex:1}
.log-item-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log-item-srv{font-size:11px;color:var(--text2)}
.log-item-kcal{font-size:13px;font-weight:700;color:var(--primary);white-space:nowrap}
.del-btn{background:none;border:none;cursor:pointer;color:var(--text3);font-size:16px;padding:2px 4px}
.del-btn:active{color:var(--danger)}
.edit-chevron{color:var(--text3);font-size:20px;flex-shrink:0;line-height:1}
.log-item{cursor:pointer}
.meal-empty{padding:10px 14px;font-size:13px;color:var(--text3)}
.search-box{position:relative;margin-bottom:12px}
.search-box input{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:12px 42px 12px 14px;font-family:var(--font);font-size:15px;color:var(--text1);outline:none}
.search-box input:focus{border-color:var(--primary)}
.s-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:18px;pointer-events:none}
.meal-switch{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px;padding-bottom:2px}
.meal-switch::-webkit-scrollbar{display:none}
.meal-tab{flex-shrink:0;background:var(--surface);border:1.5px solid var(--border);border-radius:20px;padding:5px 12px;font-family:var(--font);font-size:12px;font-weight:700;cursor:pointer;color:var(--text2);white-space:nowrap}
.meal-tab.active{border-color:var(--primary);color:var(--primary);background:var(--primary-dim)}
.food-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.food-card:active{background:var(--surface2)}
.food-card-name{font-size:14px;font-weight:600;color:var(--text1);line-height:1.3}
.food-card-brand{font-size:12px;color:var(--text2);margin-top:2px}
.food-card-kcal{font-size:14px;font-weight:700;color:var(--primary);flex-shrink:0;text-align:right}
.food-card-unit{font-size:10px;font-weight:500;color:var(--text2)}
.prog-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.prog-card-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text2);margin-bottom:14px}
.prog-row{margin-bottom:12px}
.prog-meta{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}
.prog-meta-name{font-weight:700}
.prog-meta-val{color:var(--text2);font-variant-numeric:tabular-nums}
.prog-track{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;border-radius:99px;transition:width .4s}
.prog-cal .prog-fill{background:var(--warn)}
.prog-carb .prog-fill{background:#7c5cfc}
.prog-prot .prog-fill{background:var(--primary)}
.prog-fat .prog-fill{background:var(--teal)}
.breakdown-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center;margin-bottom:10px}
.breakdown-pct{font-size:22px;font-weight:800}
.breakdown-name{font-size:11px;color:var(--text2)}
.rem-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
.rem-row:last-child{border-bottom:none}
.rem-label{color:var(--text2)}
.rem-val{font-weight:600}
.set-section{margin-bottom:20px}
.set-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text2);margin-bottom:10px}
.set-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:12px}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);font-size:14px}
.set-row:last-child{border-bottom:none}
.set-row-label{color:var(--text2)}
.set-row-val{font-weight:600}
.load-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px}
.load-opt{padding:10px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;color:var(--text2);text-align:center;transition:border-color .15s,color .15s,background .15s}
.load-opt.active{border-color:var(--primary);color:var(--primary);background:var(--primary-dim)}
.day-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-bottom:14px}
.day-scroll::-webkit-scrollbar{display:none}
.day-chip{flex-shrink:0;background:var(--surface);border:1.5px solid var(--border);border-radius:20px;padding:6px 14px;font-family:var(--font);font-size:12px;font-weight:700;cursor:pointer;color:var(--text2);white-space:nowrap}
.day-chip.active{border-color:var(--primary);color:var(--primary);background:var(--primary-dim)}
.load-badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}
.load-rest{background:rgba(107,103,96,0.12);color:var(--text2)}
.load-easy{background:var(--primary-dim);color:var(--primary)}
.load-hard{background:var(--warn-dim);color:var(--warn)}
.load-long{background:rgba(124,92,252,0.12);color:#7c5cfc}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.open{opacity:1;pointer-events:all}
.sheet{background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;width:100%;max-height:85vh;overflow-y:auto;padding:20px 16px max(32px,env(safe-area-inset-bottom,32px));transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1)}
.overlay.open .sheet{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:99px;margin:0 auto 16px}
.sheet-title{font-size:18px;font-weight:800;margin-bottom:4px}
.sheet-sub{font-size:12px;color:var(--text2);margin-bottom:16px}
.nf-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.nf-cell{background:var(--surface2);border-radius:8px;padding:8px;text-align:center}
.nf-val{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.nf-name{font-size:10px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.nf-cal{color:var(--warn)}
.nf-carb{color:#7c5cfc}
.nf-prot{color:var(--primary)}
.nf-fat{color:var(--teal)}
.nf-extra{font-size:11px;color:var(--text2);margin-bottom:14px}
.srv-row{display:flex;align-items:flex-end;gap:10px;margin-bottom:14px}
.srv-row .form-group{flex:1;margin:0}
.toast{position:fixed;bottom:calc(var(--nav-h) + 12px);left:50%;transform:translateX(-50%) translateY(12px);background:var(--text1);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;transition:opacity .2s,transform .2s;white-space:nowrap;z-index:200;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;padding:32px 0}
.empty-icon{font-size:36px;margin-bottom:10px}
.empty-msg{font-size:14px;color:var(--text2)}
.empty-sub{font-size:12px;color:var(--text3);margin-top:4px}
.divider{height:1px;background:var(--border);margin:12px 0}
.text-muted{color:var(--text2);font-size:13px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.1/umd/index.min.js"></script>
</head>
<body>

<div id="wizard-overlay" class="hidden">
  <div class="wiz-logo">🥗</div>
  <div class="wiz-title">Nutrition Tracker</div>
  <div class="wiz-sub">Let's set up your macro targets</div>
  <div class="wiz-prog" id="wiz-progress"></div>
  <div id="wiz-body"></div>
  <div class="wiz-nav">
    <button class="btn btn-secondary" id="wiz-back" onclick="wizBack()" style="flex:1">Back</button>
    <button class="btn btn-primary" id="wiz-next" onclick="wizNext()" style="flex:2">Continue</button>
  </div>
</div>

<div id="app">
  <div id="app-header">
    <div class="header-row">
      <div>
        <div class="app-title">Nutrition <span>Tracker</span></div>
        <div class="header-date" id="header-date"></div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" onclick="window.open('https://toddcrone2026.github.io/marathon-tracker/','_blank')" title="Marathon Tracker">🏃</button>
        <button class="icon-btn" onclick="openSettings()">⚙️</button>
      </div>
    </div>
    <div class="macro-strip">
      <div class="macro-strip-top">
        <div class="macro-strip-label" id="macro-bar-title">Today's Macros</div>
        <div id="load-badge-wrap"></div>
      </div>
      <div class="macro-tiles" id="macro-pills-wrap"></div>
    </div>
  </div>
  <div id="tab-content"></div>
  <nav id="bottom-nav">
    <button class="nav-btn active" data-tab="log" onclick="switchTab('log')">
      <span class="nav-icon">📋</span><span class="nav-label">Log</span>
    </button>
    <button class="nav-btn" data-tab="search" onclick="switchTab('search')">
      <span class="nav-icon">🔍</span><span class="nav-label">Search</span>
    </button>
    <button class="nav-btn" data-tab="summary" onclick="switchTab('summary')">
      <span class="nav-icon">📊</span><span class="nav-label">Summary</span>
    </button>
  </nav>
</div>

<div class="overlay" id="add-sheet-overlay" onclick="closeAddSheet(event)">
  <div class="sheet" id="add-sheet-body"></div>
</div>
<div class="overlay" id="settings-overlay" onclick="closeSettings(event)">
  <div class="sheet" id="settings-body"></div>
</div>
<div class="overlay" id="ai-overlay" onclick="closeAIOverlay(event)" style="display:none">
  <div class="sheet" style="max-height:80vh;overflow-y:auto">
    <div style="display:flex;align-items:center;gap:10px;padding:16px 16px 0">
      <div style="font-size:17px;font-weight:800;color:var(--text);flex:1" id="ai-modal-title">🤖 AI Nutrition Coach</div>
      <button onclick="closeAIOverlay()" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--text2)">✕</button>
    </div>
    <div id="ai-modal-body" style="padding:12px 16px 24px"></div>
  </div>
</div>
<!-- Barcode Scanner Modal -->
<div id="scanner-overlay" style="display:none;position:fixed;inset:0;background:#000;z-index:200;flex-direction:column;align-items:center;justify-content:flex-start;">

function calcTargets(p,load){
  const wKg=(p.weightLbs||180)*0.453592,hCm=(p.heightIn||70)*2.54,a=p.age||30;
  const bmr=p.sex==='female'?10*wKg+6.25*hCm-5*a-161:10*wKg+6.25*hCm-5*a+5;
  const mult={rest:1.35,easy:1.55,hard:1.75,long:1.90}[load||p.trainingLoad||'easy']||1.55;
  let kcal=Math.round(bmr*mult);
  if(p.goal==='lose')kcal=Math.round(kcal*0.85);
  if(p.goal==='gain')kcal=Math.round(kcal*1.10);
  const protMin=Math.round((p.weightLbs||180)*0.8);
  const protKcal=Math.max(protMin*4,Math.round(kcal*0.25));
  const fatKcal=Math.round(kcal*0.25);
  const carbKcal=kcal-protKcal-fatKcal;
  return{kcal,carbs:Math.round(carbKcal/4),protein:Math.round(protKcal/4),fat:Math.round(fatKcal/9)};
}
function getTodayLoad(){
  // Read today's workout from marathon app if available
  try{
    const mw=JSON.parse(localStorage.getItem('nt_marathon_today')||'null');
    if(mw&&mw.date===todayStr()){
      const miles=mw.miles||0,type=mw.type||'';
      if(type==='rest')return'rest';
      if(type==='recovery'||miles<=3)return'easy';
      if(type==='long'||miles>=10)return'long';
      if(miles>=6)return'hard';
      return'easy';
    }
  }catch(e){}
  return profile?.trainingLoad||'easy';
}

function ringHtml(pct,cls){
  const r=18,circ=2*Math.PI*r,dash=circ-(Math.min(pct,1)*circ);
  const st=pct>1?'over':pct>0.85?'warn':cls;
  return `<div class="mring"><svg width="44" height="44" viewBox="0 0 44 44"><circle class="mring-bg" cx="22" cy="22" r="${r}"/><circle class="mring-fill ${st}" cx="22" cy="22" r="${r}" stroke-dasharray="${circ.toFixed(2)}" stroke-dashoffset="${dash.toFixed(2)}"/></svg><span class="mring-pct">${Math.round(pct*100)}%</span></div>`;
}
function pieRingHtml(totals,targets){
  const r=48,circ=2*Math.PI*r,cx=60,cy=60,size=120;
  const totalKcal=targets.kcal||1;
  const carbKcal=totals.carbs*4,protKcal=totals.protein*4,fatKcal=totals.fat*9;
  const usedKcal=Math.min(carbKcal+protKcal+fatKcal,totalKcal);
  // fractions of the full circle
  const fCarb=Math.min(carbKcal/totalKcal,1);
  const fProt=Math.min(protKcal/totalKcal,1-fCarb);
  const fFat=Math.min(fatKcal/totalKcal,1-fCarb-fProt);
  function arc(frac,offset,color){
    if(frac<=0)return'';
    const dash=(frac*circ).toFixed(2),gap=(circ-frac*circ).toFixed(2);
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="butt" stroke-dasharray="${dash} ${gap}" stroke-dashoffset="${(-offset*circ).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"/>`;
  }
  const calPct=Math.round(Math.min(usedKcal/totalKcal,1)*100);
  return `<div class="pie-ring-wrap">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--border)" stroke-width="10"/>
      ${arc(fCarb,0,'#f5a623')}
      ${arc(fProt,fCarb,'#27ae60')}
      ${arc(fFat,fCarb+fProt,'#e53935')}
    </svg>
    <div class="pie-ring-center">
      <div class="pie-cal-num">${totals.kcal}</div>
      <div class="pie-cal-label">of ${targets.kcal}</div>
      <div class="pie-cal-unit">kcal</div>
    </div>
  </div>`;
}
function renderMacroBar(){
  const targets=calcTargets(profile||{},getTodayLoad()),totals=calcTotals(foodLog);
  targetsCache=targets;
  const load=getTodayLoad();
  const lL={rest:'Rest Day',easy:'Easy Run',hard:'Hard Run',long:'Long Run'};
  const lC={rest:'load-rest',easy:'load-easy',hard:'load-hard',long:'load-long'};
  document.getElementById('load-badge-wrap').innerHTML=`<span class="load-badge ${lC[load]}">${lL[load]}</span>`;
  function st(c,t){return c>t?'over':c/t>0.85?'warn':''}
  const macros=[
    {label:'Carbs',val:totals.carbs,target:targets.carbs,unit:'g',cls:'carbs'},
    {label:'Protein',val:totals.protein,target:targets.protein,unit:'g',cls:'protein'},
    {label:'Fat',val:totals.fat,target:targets.fat,unit:'g',cls:'fat'}
  ];
  document.getElementById('macro-pills-wrap').innerHTML=`
    <div class="macro-summary-row">
      ${pieRingHtml(totals,targets)}
    </div>
    <div class="macro-rings-row">
      ${macros.map(m=>{
        const pct=m.target>0?m.val/m.target:0;
        const s=st(m.val,m.target);
        return `<div class="macro-ring-tile ${s}">${ringHtml(pct,m.cls)}<div class="tile-name">${m.label}</div><div class="tile-val">${m.val}<span class="tile-unit">/${m.target}${m.unit}</span></div></div>`;
      }).join('')}
    </div>`;
}

async function searchUSDA(q){

    if(st)st.textContent='';

    if(!res.ok){el.innerHTML=`<div style="padding:10px 0;font-size:13px;color:var(--text2)">USDA error: HTTP ${res.status} — use Common Foods above</div>`;return}

// ── Barcode Scanner ──────────────────────────────────────────────────────
let scannerCodeReader = null;

function openScanner() {
  const overlay = document.getElementById('scanner-overlay');
  overlay.style.display = 'flex';
  const status = document.getElementById('scanner-status');
  status.textContent = 'Starting camera…';

  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}})
    .then(stream => {
      const video = document.getElementById('scanner-video');
      video.srcObject = stream;
      overlay._stream = stream;
      video.play().catch(()=>{});
      status.textContent = 'Point camera at barcode';

      // Poll with ZXing on a canvas — more reliable on iOS than decodeFromVideoDevice
      const ZXing = window.ZXing;
      if (!ZXing) { status.textContent = 'Scanner library not loaded'; return; }
      const reader = new ZXing.BrowserMultiFormatReader();
      scannerCodeReader = reader;
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');

      overlay._scanLoop = setInterval(() => {
        if (video.readyState < 2) return;
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        canvas.toBlob(blob => {
          if (!blob) return;
          const img = new Image();
          img.onload = () => {
            reader.decodeFromImage(img).then(result => {
              if (result) {
                closeScanner();
                lookupBarcode(result.getText());
              }
            }).catch(() => {});
          };
          img.src = URL.createObjectURL(blob);
        }, 'image/jpeg', 0.8);
      }, 500);
    })
    .catch(err => {
      status.textContent = 'Camera denied — check Safari settings';
    });
}

function closeScanner() {
  const overlay = document.getElementById('scanner-overlay');
  if (overlay._scanLoop) { clearInterval(overlay._scanLoop); overlay._scanLoop = null; }
  if (overlay._stream) { overlay._stream.getTracks().forEach(t => t.stop()); overlay._stream = null; }
  if (scannerCodeReader) { try { scannerCodeReader.reset(); } catch(e) {} scannerCodeReader = null; }
  const video = document.getElementById('scanner-video');
  if (video) video.srcObject = null;
  overlay.style.display = 'none';
}

async function lookupBarcode(barcode) {
  showToast('Looking up product…');
  try {
    const res = await fetch(`https://world.openfoodfacts.org/api/v0/product/${barcode}.json`);
    const data = await res.json();
    if (data.status !== 1 || !data.product) {
      showToast('Product not found — try searching by name');
      return;
    }
    const p = data.product;
    const n = p.nutriments || {};
    const name = p.product_name || p.generic_name || 'Unknown Product';
    const brand = p.brands || '';
    const kcal = parseFloat(n['energy-kcal_100g'] || n['energy-kcal'] || 0);
    const carbs = parseFloat(n['carbohydrates_100g'] || 0);
    const protein = parseFloat(n['proteins_100g'] || 0);
    const fat = parseFloat(n['fat_100g'] || 0);
    const fiber = parseFloat(n['fiber_100g'] || 0);
    const sugar = parseFloat(n['sugars_100g'] || 0);
    const sodium = parseFloat(n['sodium_100g'] || 0);
    if (!kcal && !carbs && !protein && !fat) {
      showToast('No nutrition data for this product');
      return;
    }
    pendingFood = { name, brand, kcalPer100: kcal, carbsPer100: carbs, proteinPer100: protein, fatPer100: fat, fiber, sugar, sodium };
    switchTab('search');
    showAddSheetFromPending();
  } catch(e) {
    showToast('Lookup failed — check connection');
  }
}

function renderMd(md){
  return md
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/^### (.+)$/gm,'<h4 style="margin:12px 0 4px;font-size:14px;font-weight:700;color:var(--text)">$1</h4>')
    .replace(/^## (.+)$/gm,'<h3 style="margin:14px 0 6px;font-size:15px;font-weight:800;color:var(--text)">$1</h3>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/^- (.+)$/gm,'<li style="margin:3px 0;padding-left:4px">$1</li>')
    .replace(/(<li[^>]*>[\s\S]*?<\/li>)+/g,s=>`<ul style="margin:6px 0 6px 16px;padding:0;list-style:disc">${s}<\/ul>`)
    .replace(/\n\n/g,'<\/p><p style="margin:8px 0">')
    .replace(/^(?!<[hul])(.+)$/gm,(m,p1)=>p1.trim()?`<p style="margin:6px 0">${p1}</p>`:m);
}
